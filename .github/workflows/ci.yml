name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install and consume the package
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S examples/consumer -B consumer-build -G Ninja \
                -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer-build --parallel 4
          ./consumer-build/consumer

      - name: Benchmark smoke test
        run: >-
          ./build/benchmarks/containers_benchmarks
          --benchmark_min_time=0.01s
          --benchmark_filter=BM_SpscQueueMessageTransfer

  sanitizers:
    name: sanitize-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined
            test_filter: '*'
          - name: tsan
            flags: -fsanitize=thread
            test_filter: 'ConcurrentQueueTest.*:SpscQueueTest.*:SpscMessageStress.*:MpscQueueTest.*:ThreadTest.*:ScopedThreadTest.*:AtomicSharedPtrTest.*'

    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          SANITIZER_FLAGS: ${{ matrix.flags }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_BENCHMARK=OFF
          -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS -O1 -g -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        env:
          GTEST_FILTER: ${{ matrix.test_filter }}
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure --no-tests=error

  windows:
    name: windows-msvc
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Pin down nothing about which Visual Studio ships with the runner image:
      # vswhere resolves the installed MSVC, and Ninja keeps the generator
      # independent of the VS version.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Install and consume the package
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S examples/consumer -B consumer-build -G Ninja -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer-build --parallel 4
          ./consumer-build/consumer.exe

      - name: Benchmark smoke test
        run: >-
          ./build/benchmarks/containers_benchmarks.exe
          --benchmark_min_time=0.01s
          --benchmark_filter=BM_SpscQueueMessageTransfer
